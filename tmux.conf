# ~/.tmux.conf — persistent workspace tuned for Claude Code and many parallel sessions.
# Reload after editing: prefix + r   (prefix is the default Ctrl+b)

# --- Terminal capabilities --------------------------------------------------
set -g default-terminal "tmux-256color"
# GNOME Terminal (VTE) reports xterm-256color: enable truecolor, OSC 8 links,
# and extended keys (CSI u) where the outer terminal can send them.
set -as terminal-features ",xterm*:RGB:hyperlinks:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
# Let Claude Code's escape sequences (notifications, progress) reach the terminal.
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10

# --- General ----------------------------------------------------------------
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
# Killing a session switches to another one instead of dropping out of tmux.
set -g detach-on-destroy off
# Outer terminal tab title: "session · window".
set -g set-titles on
set -g set-titles-string "#S · #W"

# Window names: a running Claude shows its session name (the title it sets),
# anything else shows the current directory.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{=24:pane_title},#{b:pane_current_path}}'

# --- "Needs attention" markers ----------------------------------------------
# The Claude notification hook rings the pane bell; tmux flags that window
# in the status bar until you visit it.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- Keys -------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# GNOME Terminal-style tab keys, no prefix needed: Ctrl+PgUp/PgDn switch
# windows, Ctrl+Shift+PgUp/PgDn move the current window left/right.
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n C-S-PageUp swap-window -d -t -1
bind -n C-S-PageDown swap-window -d -t +1
# Editors that keep their own Ctrl+N / Ctrl+W (the two bindings below).
%hidden EDITORS='^(vi|vim|nvim|view|vimdiff|emacs|nano)$'
# Ctrl+N opens a new window, like a new tab elsewhere. Editors that use
# Ctrl+N themselves (vim completion, nano) still get it; elsewhere it only
# duplicates the Down arrow. Prefix + Ctrl+N sends a literal Ctrl+N.
bind -n C-n if -F "#{m/r:$EDITORS,#{pane_current_command}}" \
    'send-keys C-n' 'new-window -c "#{pane_current_path}"'
bind C-n send-keys C-n
# Ctrl+W closes the window, like Ctrl+Shift+W closes a GNOME Terminal tab:
# at once when its panes are only idle shells, after a y/n prompt when
# something still runs there (Claude, a server). This takes delete-word from
# bash and Claude Code; Alt+Backspace does the same there. Editors still get
# Ctrl+W, and prefix + Ctrl+W sends a literal one.
bind -n C-w if -F "#{m/r:$EDITORS,#{pane_current_command}}" 'send-keys C-w' {
    if -F '#{==:#{P:#{?#{m/r:^(bash|zsh|sh|fish)$,#{pane_current_command}},,x}},}' \
        'kill-window' \
        'confirm-before -p "Close window #W? Something is still running in it. (y/n)" kill-window'
}
bind C-w send-keys C-w
# New windows and splits open in the current directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Project picker (the `cs` shell function) in a popup.
bind P display-popup -E -w 70% -h 60% "bash -ic cs"
# Claude Code agent view (all sessions) in a popup.
bind A display-popup -E -w 90% -h 85% "claude agents"
# Cheatsheet of these keys and the shell helpers (tmhelp) in a popup.
bind H display-popup -E -w 80% -h 85% "~/.local/bin/tmhelp -p"
# Search the conversation of the Claude session in this window (cgrep); tmux
# copy mode can't, because Claude Code draws on the alternate screen.
bind F command-prompt -p "search Claude:" \
    'display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "~/.local/bin/cgrep \"%%\""'
# Session/window tree: prefix + s (built in), prefix + w (built in).

# Vim-style copy mode, copying to the Wayland clipboard. copy-command also
# covers the built-in bindings: double-click (word), triple-click (line), Enter.
set -s copy-command "wl-copy"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- Status bar (colors match the "Flat" GNOME Terminal profile) ------------
# On top, so it does not stack with Claude Code's own footer at the bottom.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#2c3e50,fg=#bdc3c7"
set -g status-left-length 30
set -g status-left "#[bold,fg=#1abc9c] #S #[default]│ "
set -g status-right "#[fg=#7f8c8d]%H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bold,fg=#1f2d3a,bg=#1abc9c] #I:#W#F "
setw -g window-status-bell-style "bold,fg=#1f2d3a,bg=#f1c40f"
setw -g window-status-separator ""
set -g pane-active-border-style "fg=#1abc9c"
set -g message-style "bg=#1abc9c,fg=#1f2d3a"
